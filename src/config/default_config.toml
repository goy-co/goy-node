# =====================================================================
# Goy Node Configuration
# Generated by: goy-node config init
# Docs: https://docs.goy.company/node/config
# =====================================================================

[coord]
# URL do coord-server
url = "http://localhost:8080"
# Admin API key (obtida no setup do coord-server)
admin_api_key = ""
# Intervalo entre heartbeats (segundos)
heartbeat_interval_secs = 30
# Timeout para requests ao coord-server (segundos)
request_timeout_secs = 10

[relay]
# WebSocket URL do relay Nostr local (strfry)
url = "ws://127.0.0.1:7777"
# Comando opcional para importação em massa
# import_cmd = "strfry import"

[mesh]
# Endereço e porta onde o mesh agent escuta
listen = "0.0.0.0:8443"
# Seeds conhecidos para bootstrap
seeds = []
# URL do registry central (opcional)
# registry_url = "https://registry.goy.company"
# Intervalo de keepalive (segundos)
heartbeat_secs = 30
# TLS mútuo entre peers
tls_enabled = true
# Fingerprints SHA-256 pré-aprovados
# [mesh.trusted_fingerprints]
# "ws://peer1:8443" = "a1b2c3d4..."

[storage]
# Diretório de dados
data_dir = "/var/lib/goy-node"
# Espaço adicional voluntário em GB (acima dos 50 GB obrigatórios)
extra_contribution_gb = 0

[metrics]
# Servidor HTTP de métricas ("off" para desativar)
listen = "127.0.0.1:9090"

[log]
# Nível: trace, debug, info, warn, error
level = "info"
# Formato: pretty, json
format = "pretty"
