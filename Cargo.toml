[package]
name = "goy-node"
version = "0.1.1"
edition = "2024"
authors = ["The Goy Company"]
description = "Mesh agent for Goy Node — automatic Nostr relay synchronization"
license = "Proprietary"
repository = "https://github.com/goy-co/goy-node"

[lib]
name = "goy_node"
path = "src/lib.rs"

[[bin]]
name = "goy-node"
path = "src/main.rs"


[dependencies]
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# WebSocket client/server (conexão com relay local + peers)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Serialização / protocolo Nostr
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tipos e validação Nostr (eventos, filtros, assinaturas)
nostr = "0.38"

# HTTP client (registry, discovery, health checks)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Configuração
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
url = "2"
rpassword = "7"
dialoguer = "0.12"

# Logging estruturado
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Diretórios padrão (XDG)
directories = "5"

# Graceful shutdown / cancellation
tokio-util = "0.7"

# UUID para node IDs, session IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Anyhow
anyhow = "1"

# Backoff exponencial para reconnect
backoff = { version = "0.4", features = ["tokio"] }

# future-util
futures-util = "0.3"

# Concorrência: set dedup + peer tracking
dashmap = "6"

# Timestamps para heartbeat/cursor
chrono = { version = "0.4", features = ["serde"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
sha2 = "0.10"
hex = "0.4"
rustls-pki-types = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "event_throughput"
harness = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
